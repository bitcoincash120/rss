name: Build RSS Feed

on:
  push:
    branches: [ main ]
    paths:
      - 'posts.json'
      - 'generate_rss.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedgen

      - name: Generate RSS
        run: python generate_rss.py

      - name: Commit and push rss.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add rss.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update rss.xml" && git push)
